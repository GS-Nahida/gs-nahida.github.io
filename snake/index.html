<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>像素贪吃蛇 - 32×32</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --panel-bg: #111118;
            --text: #d0d0db;
            --accent: #4caf84;
            --danger: #ff5252;
            --gold: #ffb74d;
            --border: #252530;
            --font-main: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', 'Helvetica Neue', 'Segoe UI', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: var(--font-main);
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-y: auto;
            padding: 12px;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            max-width: 540px;
            width: 100%;
        }

        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 12px 18px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
        }

        .game-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-main);
        }

        .game-title .pixel-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 2px;
            animation: pulse-dot 1.2s ease-in-out infinite;
        }
        .game-title .pixel-dot:nth-child(2) { animation-delay: 0.4s; }
        .game-title .pixel-dot:nth-child(3) { animation-delay: 0.8s; }

        @keyframes pulse-dot {
            0%,100% { opacity: 0.35; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.6); }
        }

        .score-display {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 0.9rem;
            color: var(--text);
            letter-spacing: 0.5px;
            font-family: var(--font-main);
            flex-wrap: wrap;
        }

        .score-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .score-label {
            color: #888;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .score-value {
            color: #fff;
            font-weight: bold;
            font-size: 1.05rem;
            min-width: 26px;
            text-align: center;
            background: #1a1a24;
            padding: 2px 10px;
            border-radius: 4px;
            border: 1px solid #2e2e3a;
        }
        .food-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .food-dot {
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 2px;
            animation: pulse-dot 1s ease-in-out infinite;
        }

        .canvas-container {
            position: relative;
            border: 2px solid var(--border);
            border-radius: 6px;
            box-shadow: 0 0 32px rgba(76, 175, 132, 0.06), 0 0 60px rgba(0,0,0,0.6);
            line-height: 0;
            background: #0d0d14;
            transition: box-shadow 0.25s;
            width: 100%;
            aspect-ratio: 1 / 1;
        }
        .canvas-container.game-over-glow {
            box-shadow: 0 0 38px rgba(255, 82, 82, 0.25), 0 0 70px rgba(255,82,82,0.08);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border-radius: 5px;
        }

        .game-over-overlay {
            position: absolute;
            top:0;left:0;width:100%;height:100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
            font-family: var(--font-main);
        }
        .game-over-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .game-over-text {
            font-size: 2rem;
            font-weight: bold;
            color: #ff5252;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255,82,82,0.7);
            margin-bottom: 6px;
        }
        .game-over-score {
            font-size: 1rem;
            color: #ccc;
            margin-bottom: 18px;
            letter-spacing: 0.8px;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
        }
        .game-btn {
            font-family: var(--font-main);
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            padding: 10px 24px;
            background: transparent;
            color: #ddd;
            border: 2px solid #3a3a4a;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            background: rgba(20,20,28,0.8);
            backdrop-filter: blur(4px);
            min-width: 110px;
        }
        .game-btn:hover:not(:disabled) {
            border-color: #6a6a82;
            color: #fff;
            background: rgba(40,40,56,0.9);
        }
        .game-btn:active:not(:disabled) {
            transform: scale(0.96);
        }
        .game-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            border-color: #2a2a36;
            color: #777;
        }
        .restart-btn-overlay {
            font-family: var(--font-main);
            font-size: 1rem;
            letter-spacing: 2px;
            padding: 10px 28px;
            background: transparent;
            color: #fff;
            border: 2px solid #ff5252;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            pointer-events: auto;
        }
        .restart-btn-overlay:hover {
            background: #ff5252;
            color: #000;
            box-shadow: 0 0 22px rgba(255,82,82,0.5);
        }

        .mobile-hint {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #888;
            letter-spacing: 0.8px;
            font-family: var(--font-main);
            flex-wrap: wrap;
        }
        .mobile-hint .swipe-icon {
            font-size: 1.1rem;
            filter: grayscale(0.3);
        }
        .key-badge {
            display: inline-block;
            background: #1a1a24;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 3px 9px;
            font-size: 0.7rem;
            color: #aaa;
            letter-spacing: 0.5px;
            font-family: var(--font-main);
        }
        .key-badge.highlight {
            color: var(--accent);
            border-color: #3a6b50;
        }

        @media (max-width: 560px) {
            .game-header { padding: 10px 12px; }
            .game-title { font-size: 1.1rem; }
            .game-btn { padding: 8px 18px; font-size: 0.8rem; min-width: 90px; }
            .game-over-text { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="game-header">
        <div class="game-title">
            <span class="pixel-dot"></span>像素贪吃蛇<span class="pixel-dot"></span>
        </div>
        <div class="score-display">
            <div class="score-item"><span class="score-label">长度</span><span class="score-value" id="scoreLength">5</span></div>
            <div class="score-item food-indicator"><span class="food-dot"></span><span class="score-label">食物</span><span class="score-value" id="foodCount">5</span></div>
            <div class="score-item"><span class="score-label">最高</span><span class="score-value" id="highScore">5</span></div>
        </div>
    </div>

    <div class="canvas-container" id="canvasContainer">
        <canvas id="gameCanvas"></canvas>
        <div class="game-over-overlay" id="gameOverOverlay">
            <div class="game-over-text">游戏结束</div>
            <div class="game-over-score" id="gameOverScore">最终长度: 5</div>
            <button class="restart-btn-overlay" id="restartOverlayBtn">重新开始</button>
        </div>
    </div>

    <div class="button-row">
        <button class="game-btn" id="pauseResumeBtn" title="暂停 / 继续游戏">⏯️ 暂停</button>
        <button class="game-btn" id="restartMainBtn" title="重新开始游戏">↺ 重新开始</button>
    </div>

    <div class="mobile-hint">
        <span class="swipe-icon">👆</span> 移动端滑动屏幕控制方向
        <span style="margin:0 6px;color:#444;">|</span>
        <span class="key-badge highlight">W</span><span class="key-badge highlight">A</span><span class="key-badge highlight">S</span><span class="key-badge highlight">D</span>
        <span style="margin:0 4px;">/</span>
        <span class="key-badge highlight">↑</span><span class="key-badge highlight">←</span><span class="key-badge highlight">↓</span><span class="key-badge highlight">→</span>
    </div>
</div>

<script>
    (function() {
        // ==================== 常量与配置 ====================
        const GRID_SIZE = 32;
        const CELL_SIZE = 16;
        const CANVAS_SIZE = GRID_SIZE * CELL_SIZE;
        const INITIAL_SNAKE_LENGTH = 5;
        const MOVE_INTERVAL_MS = 500;
        const FOOD_SPAWN_INTERVAL_MS = 10000;
        const FOOD_SPAWN_MIN = 3;
        const FOOD_SPAWN_MAX = 5;
        const FOOD_CAP = 25;
        const INITIAL_FOOD_COUNT = 5;

        // ==================== DOM元素 ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const canvasContainer = document.getElementById('canvasContainer');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const gameOverScoreEl = document.getElementById('gameOverScore');
        const restartOverlayBtn = document.getElementById('restartOverlayBtn');
        const scoreLengthEl = document.getElementById('scoreLength');
        const foodCountEl = document.getElementById('foodCount');
        const highScoreEl = document.getElementById('highScore');
        const pauseResumeBtn = document.getElementById('pauseResumeBtn');
        const restartMainBtn = document.getElementById('restartMainBtn');

        canvas.width = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;

        // ==================== 游戏状态 ====================
        let snake = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let foods = [];
        let gameRunning = false;
        let gamePaused = false;
        let gameOver = false;
        let moveIntervalId = null;
        let foodSpawnIntervalId = null;
        let highScore = INITIAL_SNAKE_LENGTH;
        let animationFrameId = null;

        const foodColorPalette = [
            '#ff5252','#ff6d6d','#ff8a80','#ff4081','#f50057',
            '#ffab40','#ff9100','#ffc107','#ffeb3b','#ffd740',
            '#69f0ae','#00e676','#76ff03','#b2ff59','#40c4ff',
            '#448aff','#7c4dff','#b388ff','#e040fb','#ff80ab'
        ];

        try {
            const saved = localStorage.getItem('pixelSnakeHighScoreV3');
            if (saved) {
                const val = parseInt(saved,10);
                if (!isNaN(val) && val >= INITIAL_SNAKE_LENGTH) highScore = val;
            }
        } catch(e) {}
        highScoreEl.textContent = highScore;

        // ==================== 辅助函数 ====================
        function randInt(min,max) { return Math.floor(Math.random()*(max-min+1))+min; }
        function randomFoodColor() { return foodColorPalette[randInt(0,foodColorPalette.length-1)]; }
        function isInBounds(x,y) { return x>=0 && x<GRID_SIZE && y>=0 && y<GRID_SIZE; }
        function isOnSnake(x,y) { return snake.some(s=>s.x===x && s.y===y); }
        function isOnFood(x,y) { return foods.some(f=>f.x===x && f.y===y); }

        function collectEmptyCells() {
            const empty = [];
            for(let y=0;y<GRID_SIZE;y++) for(let x=0;x<GRID_SIZE;x++) if(!isOnSnake(x,y) && !isOnFood(x,y)) empty.push({x,y});
            return empty;
        }

        function placeFoodRandom(count) {
            const empty = collectEmptyCells();
            if(empty.length===0) return 0;
            for(let i=empty.length-1;i>0;i--){ const j=randInt(0,i); [empty[i],empty[j]]=[empty[j],empty[i]]; }
            const toPlace = Math.min(count, empty.length);
            for(let i=0;i<toPlace;i++) foods.push({ x:empty[i].x, y:empty[i].y, color:randomFoodColor() });
            return toPlace;
        }

        function updateUI() {
            scoreLengthEl.textContent = snake.length;
            foodCountEl.textContent = foods.length;
            if(snake.length > highScore) {
                highScore = snake.length;
                highScoreEl.textContent = highScore;
                try { localStorage.setItem('pixelSnakeHighScoreV3', highScore); } catch(e) {}
            }
        }

        function updatePauseButton() {
            if (gameOver) {
                pauseResumeBtn.disabled = true;
                pauseResumeBtn.textContent = '⏯️ 暂停';
                return;
            }
            pauseResumeBtn.disabled = false;
            if (gamePaused) {
                pauseResumeBtn.textContent = '▶️ 继续';
            } else if (gameRunning) {
                pauseResumeBtn.textContent = '⏯️ 暂停';
            } else {
                pauseResumeBtn.textContent = '⏯️ 暂停';
            }
        }

        // ==================== 核心流程 ====================
        function pauseGame() {
            if (!gameRunning || gameOver || gamePaused) return;
            gamePaused = true;
            gameRunning = false;
            if (moveIntervalId) { clearInterval(moveIntervalId); moveIntervalId = null; }
            if (foodSpawnIntervalId) { clearInterval(foodSpawnIntervalId); foodSpawnIntervalId = null; }
            updatePauseButton();
            render();
        }

        function resumeGame() {
            if (gameOver || !gamePaused) return;
            gamePaused = false;
            gameRunning = true;
            moveIntervalId = setInterval(moveSnake, MOVE_INTERVAL_MS);
            foodSpawnIntervalId = setInterval(spawnFoodBatch, FOOD_SPAWN_INTERVAL_MS);
            updatePauseButton();
            render();
        }

        function togglePause() {
            if (gameOver) return;
            if (gamePaused) {
                resumeGame();
            } else if (gameRunning) {
                pauseGame();
            }
        }

        function endGame() {
            if (gameOver) return;
            gameOver = true;
            gameRunning = false;
            gamePaused = false;
            if (moveIntervalId) { clearInterval(moveIntervalId); moveIntervalId = null; }
            if (foodSpawnIntervalId) { clearInterval(foodSpawnIntervalId); foodSpawnIntervalId = null; }
            if (snake.length > highScore) {
                highScore = snake.length;
                highScoreEl.textContent = highScore;
                try { localStorage.setItem('pixelSnakeHighScoreV3', highScore); } catch(e) {}
            }
            gameOverScoreEl.textContent = '最终长度: ' + snake.length;
            gameOverOverlay.classList.add('active');
            canvasContainer.classList.add('game-over-glow');
            updatePauseButton();
            render(true);
        }

        function moveSnake() {
            if (!gameRunning || gameOver || gamePaused) return;
            direction = { ...nextDirection };
            const head = snake[0];
            const newHead = { x: head.x + direction.x, y: head.y + direction.y };

            if (!isInBounds(newHead.x, newHead.y)) {
                endGame();
                return;
            }

            let ateFood = false;
            for (let i = foods.length-1; i>=0; i--) {
                if (foods[i].x === newHead.x && foods[i].y === newHead.y) {
                    foods.splice(i,1);
                    ateFood = true;
                    break;
                }
            }

            snake.unshift(newHead);
            if (!ateFood) snake.pop();

            updateUI();
            render();
        }

        function spawnFoodBatch() {
            if (!gameRunning || gameOver || gamePaused) return;
            if (foods.length >= FOOD_CAP) return;
            const remaining = FOOD_CAP - foods.length;
            const toSpawn = Math.min(randInt(FOOD_SPAWN_MIN, FOOD_SPAWN_MAX), remaining);
            if (toSpawn > 0) {
                placeFoodRandom(toSpawn);
                updateUI();
                render();
            }
        }

        function initGame() {
            if (moveIntervalId) clearInterval(moveIntervalId);
            if (foodSpawnIntervalId) clearInterval(foodSpawnIntervalId);
            moveIntervalId = null;
            foodSpawnIntervalId = null;

            const startY = Math.floor(GRID_SIZE/2);
            const startX = Math.floor(GRID_SIZE*0.56);
            snake = [];
            for(let i=0;i<INITIAL_SNAKE_LENGTH;i++) snake.push({x:startX-i, y:startY});
            direction = { x:1, y:0 };
            nextDirection = { x:1, y:0 };
            foods = [];
            placeFoodRandom(INITIAL_FOOD_COUNT);

            gameOver = false;
            gamePaused = false;
            gameRunning = true;
            gameOverOverlay.classList.remove('active');
            canvasContainer.classList.remove('game-over-glow');
            updateUI();
            updatePauseButton();

            moveIntervalId = setInterval(moveSnake, MOVE_INTERVAL_MS);
            foodSpawnIntervalId = setInterval(spawnFoodBatch, FOOD_SPAWN_INTERVAL_MS);
            render();
        }

        function restartGame() {
            initGame();
            startAnimationLoop();
        }

        function changeDirection(dx, dy) {
            if (!gameRunning || gameOver || gamePaused) return;
            if (dx === -direction.x && dy === -direction.y) return;
            if (dx === 0 && dy === 0) return;
            if (Math.abs(dx)+Math.abs(dy) !== 1) return;
            nextDirection = { x: dx, y: dy };
        }

        // ==================== 渲染 ====================
        function render(isGameOverFrame = false) {
            ctx.clearRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
            ctx.fillStyle = '#0d0d14';
            ctx.fillRect(0,0,CANVAS_SIZE,CANVAS_SIZE);

            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.lineWidth = 1;
            for(let i=0;i<=GRID_SIZE;i++) {
                const pos = i*CELL_SIZE;
                ctx.beginPath(); ctx.moveTo(pos,0); ctx.lineTo(pos,CANVAS_SIZE); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,pos); ctx.lineTo(CANVAS_SIZE,pos); ctx.stroke();
            }

            for(const f of foods) {
                const fx=f.x*CELL_SIZE, fy=f.y*CELL_SIZE;
                ctx.fillStyle = f.color;
                ctx.fillRect(fx+1,fy+1,CELL_SIZE-2,CELL_SIZE-2);
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fillRect(fx+2,fy+2,3,3);
            }

            for(let i=snake.length-1;i>=0;i--) {
                const seg=snake[i], sx=seg.x*CELL_SIZE, sy=seg.y*CELL_SIZE;
                if(i===0) {
                    if(isGameOverFrame) {
                        ctx.fillStyle='#ff1744'; ctx.fillRect(sx,sy,CELL_SIZE,CELL_SIZE);
                        ctx.fillStyle='#ff616f'; ctx.fillRect(sx+2,sy+2,CELL_SIZE-4,CELL_SIZE-4);
                    } else {
                        ctx.fillStyle='#69f0ae'; ctx.fillRect(sx,sy,CELL_SIZE,CELL_SIZE);
                        ctx.fillStyle='#b9f6ca'; ctx.fillRect(sx+2,sy+2,CELL_SIZE-4,CELL_SIZE-4);
                        const eye=3;
                        ctx.fillStyle='#0d0d14';
                        if(direction.x===1){ ctx.fillRect(sx+CELL_SIZE-5,sy+4,eye,eye); ctx.fillRect(sx+CELL_SIZE-5,sy+CELL_SIZE-7,eye,eye); }
                        else if(direction.x===-1){ ctx.fillRect(sx+2,sy+4,eye,eye); ctx.fillRect(sx+2,sy+CELL_SIZE-7,eye,eye); }
                        else if(direction.y===-1){ ctx.fillRect(sx+4,sy+2,eye,eye); ctx.fillRect(sx+CELL_SIZE-7,sy+2,eye,eye); }
                        else { ctx.fillRect(sx+4,sy+CELL_SIZE-5,eye,eye); ctx.fillRect(sx+CELL_SIZE-7,sy+CELL_SIZE-5,eye,eye); }
                    }
                } else {
                    const ratio = i/(snake.length-1||1);
                    const r=Math.floor(30+40*(1-ratio)), g=Math.floor(130+80*(1-ratio)), b=Math.floor(50+40*(1-ratio));
                    ctx.fillStyle=`rgb(${r},${g},${b})`;
                    ctx.fillRect(sx+1,sy+1,CELL_SIZE-2,CELL_SIZE-2);
                }
            }
        }

        function animationLoop() {
            if (gameOver) {
                render(true);
                animationFrameId = requestAnimationFrame(animationLoop);
            } else if (gameRunning || gamePaused) {
                animationFrameId = requestAnimationFrame(animationLoop);
            }
        }
        function startAnimationLoop() {
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(animationLoop);
        }

        // ==================== 事件绑定 ====================
        document.addEventListener('keydown', function(e) {
            const key = e.key.toLowerCase();
            if (key==='w'||key==='arrowup') { e.preventDefault(); changeDirection(0,-1); }
            else if (key==='s'||key==='arrowdown') { e.preventDefault(); changeDirection(0,1); }
            else if (key==='a'||key==='arrowleft') { e.preventDefault(); changeDirection(-1,0); }
            else if (key==='d'||key==='arrowright') { e.preventDefault(); changeDirection(1,0); }
        });

        pauseResumeBtn.addEventListener('click', togglePause);
        restartMainBtn.addEventListener('click', restartGame);
        restartOverlayBtn.addEventListener('click', (e) => { e.preventDefault(); restartGame(); });
        canvas.addEventListener('click', () => { if (gameOver) restartGame(); });

        let touchStartX=0, touchStartY=0, touchHandled=false;
        canvas.addEventListener('touchstart', e=>{
            if(e.touches.length===1){ touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; touchHandled=false; }
            e.preventDefault();
        }, {passive:false});
        canvas.addEventListener('touchmove', e=>{
            if(touchHandled) return;
            if(e.touches.length===1){
                const dx=e.touches[0].clientX-touchStartX, dy=e.touches[0].clientY-touchStartY;
                const threshold=22;
                if(Math.abs(dx)>threshold || Math.abs(dy)>threshold){
                    touchHandled=true;
                    if(Math.abs(dx)>Math.abs(dy)) changeDirection(dx>0?1:-1, 0);
                    else changeDirection(0, dy>0?1:-1);
                    touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY;
                    touchHandled=false;
                }
            }
            e.preventDefault();
        }, {passive:false});
        canvas.addEventListener('touchend', e=>{ touchHandled=false; e.preventDefault(); }, {passive:false});

        // ==================== 启动 ====================
        initGame();
        startAnimationLoop();
    })();
</script>
</body>
</html>
