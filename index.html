<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 字体统一：微软雅黑 + 后备 */
            font-family: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', 'Helvetica Neue', sans-serif;
            background-color: #ffffff;
            background-image: url('./f.png');
            background-size: contain;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;    /* 滚动时背景固定，更有沉浸感 */
        }

        .game-hub {
            max-width: 700px;
            width: 100%;
            text-align: center;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border-radius: 0;
            box-shadow: none;
            border: none;
            padding: 0;
        }

        .main-title {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 10px;
            color: #f2eee9;
            text-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(255, 215, 150, 0.15);
            margin: 0.2rem 0 20rem 0;
            word-break: keep-all;
            line-height: 1.15;
            font-family: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', sans-serif;
            text-transform: uppercase;
            background: linear-gradient(135deg, #f9f3e8 0%, #d9d0c0 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.6));
        }

        .button-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10rem;
            margin-top: 1rem;
        }

        /* 通用按钮样式 — 无卡片背景，更通透，但保留可读性 */
        .game-btn {
            display: inline-block;
            width: 74%;
            max-width: 300px;
            padding: 1.4rem 0.8rem;
            background: rgba(10, 14, 23, 0.55);
            backdrop-filter: blur(6px) saturate(150%);
            -webkit-backdrop-filter: blur(6px) saturate(150%);
            border: 1.5px solid rgba(255, 235, 210, 0.25);
            border-radius: 0px;
            color: #f0ede8;
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            font-family: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', sans-serif;
            cursor: pointer;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
            transform: scale(1);
        }

        .btn-go {
            background: rgba(45, 55, 80, 0.65);
            border-color: rgba(200, 180, 150, 0.3);
        }

        .btn-go:hover {
            background: rgba(70, 90, 130, 0.8);
            border-color: #d4b68a;
            box-shadow: 0 12px 28px -6px #0a0e1a, 0 0 0 1.5px rgba(255, 215, 150, 0.3);
            transform: scale(1.03);
            color: #ffffff;
        }

        .btn-snake {
            background: rgba(35, 50, 40, 0.65);
            border-color: rgba(160, 200, 140, 0.3);
        }

        .btn-snake:hover {
            background: rgba(55, 90, 65, 0.8);
            border-color: #a8d08d;
            box-shadow: 0 12px 28px -6px #0a1a0e, 0 0 0 1.5px rgba(180, 230, 150, 0.3);
            transform: scale(1.03);
            color: #f0fff0;
        }

        /* 未来更多按钮直接继承 .game-btn 即可 */

        /* 去除之前卡片自带的装饰线 */
        .game-hub::after {
            display: none;
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            .game-hub {
                padding: 0;
            }
            .main-title {
                margin: 0.2rem 0 2.8rem 0;
                font-size: clamp(3.6rem, 18vw, 5rem);
                letter-spacing: 6px;
            }
            .game-btn {
                width: 85%;
                font-size: 1.7rem;
                padding: 1.1rem 0.6rem;
            }
            .button-stack {
                gap: 2.2rem;
            }
        }

        /* 若背景图加载失败，保留深色底 + 纹理 */
/*         body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, #000000, #000000);
            z-index: -2;
        }
 */
    </style>
</head>
<body>
    <div class="game-hub">
        <h1 class="main-title">妲妲游戏站</h1>

        <div class="button-stack">
            <a href="go/index.html" class="game-btn btn-go">围棋</a>
            <a href="snake/index.html" class="game-btn btn-snake">贪吃蛇</a>
            <!-- <a href="newgame/index.html" class="game-btn btn-other">游戏</a> -->
        </div>
    </div>
</body>
</html>
