<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', 'Helvetica Neue', sans-serif;
            background-color: #10283b;
            background-image: url('./f.png');
            background-size: contain;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            padding: 16px 12px;
        }

        .game-hub {
            max-width: 700px;
            width: 100%;
            text-align: center;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border-radius: 0;
            box-shadow: none;
            border: none;
            padding: 0;
            /* 让内容更紧凑 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-title {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: 6px;
            color: #f2eee9;
            text-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(255, 215, 150, 0.15);
            margin: 0.2rem 0 1.8rem 0;
            word-break: keep-all;
            line-height: 1.2;
            font-family: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', sans-serif;
            text-transform: uppercase;
            background: linear-gradient(135deg, #f9f3e8 0%, #d9d0c0 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.6));
        }

        .button-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.2rem;
            margin-top: 0.2rem;
            width: 100%;
        }

        .game-btn {
            display: inline-block;
            width: 78%;
            max-width: 300px;
            padding: 1rem 0.6rem;
            background: rgba(10, 14, 23, 0.55);
            backdrop-filter: blur(6px) saturate(150%);
            -webkit-backdrop-filter: blur(6px) saturate(150%);
            border: 1.5px solid rgba(255, 235, 210, 0.25);
            border-radius: 0px;
            color: #f0ede8;
            font-size: 1.7rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            font-family: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', sans-serif;
            cursor: pointer;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
            transform: scale(1);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-go {
            background: rgba(45, 55, 80, 0.65);
            border-color: rgba(200, 180, 150, 0.3);
        }

        .btn-go:hover {
            background: rgba(70, 90, 130, 0.8);
            border-color: #d4b68a;
            box-shadow: 0 12px 28px -6px #0a0e1a, 0 0 0 1.5px rgba(255, 215, 150, 0.3);
            transform: scale(1.03);
            color: #ffffff;
        }

        .btn-snake {
            background: rgba(35, 50, 40, 0.65);
            border-color: rgba(160, 200, 140, 0.3);
        }

        .btn-snake:hover {
            background: rgba(55, 90, 65, 0.8);
            border-color: #a8d08d;
            box-shadow: 0 12px 28px -6px #0a1a0e, 0 0 0 1.5px rgba(180, 230, 150, 0.3);
            transform: scale(1.03);
            color: #f0fff0;
        }

        .footer-sign {
            font-size: 0.9rem;
            color: #ffffff;
            line-height: 1.6;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-top: 2.4rem;
            padding: 0 0.5rem;
            word-break: keep-all;
            display: inline-block;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 1.2rem;
            width: 80%;
        }

        .footer-sign span {
            display: inline-block;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .game-hub::after {
            display: none;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px 8px;
                align-items: center;
            }

            .game-hub {
                max-width: 100%;
                padding: 0 4px;
            }

            .main-title {
                font-size: clamp(2.2rem, 10vw, 3.2rem);
                letter-spacing: 3px;
                margin: 0.2rem 0 1.6rem 0;
            }

            .game-btn {
                width: 88%;
                max-width: 260px;
                font-size: 1.4rem;
                padding: 0.9rem 0.4rem;
                letter-spacing: 2px;
                border-width: 1px;
            }

            .button-stack {
                gap: 1.6rem;
                margin-top: 0;
            }

            .footer-sign {
                font-size: 0.75rem;
                margin-top: 1.8rem;
                padding-top: 0.8rem;
                width: 90%;
            }
            .footer-sign span {
                font-size: 0.7rem;
            }
        }

        @media (max-width: 380px) {
            .main-title {
                font-size: clamp(1.8rem, 9vw, 2.4rem);
                letter-spacing: 2px;
                margin: 0.1rem 0 1.2rem 0;
            }
            .game-btn {
                font-size: 1.2rem;
                padding: 0.7rem 0.3rem;
                width: 92%;
            }
            .button-stack {
                gap: 1.2rem;
            }
            .footer-sign {
                font-size: 0.65rem;
                margin-top: 1.4rem;
            }
        }

    </style>
</head>
<body>
    <div class="game-hub">
        <h1 class="main-title">妲妲游戏站</h1>

        <div class="button-stack">
            <a href="go/index.html" class="game-btn btn-go">围棋</a>
            <a href="snake/index.html" class="game-btn btn-snake">贪吃蛇</a>
            <!-- <a href="newgame/index.html" class="game-btn btn-other">游戏</a> -->
        </div>

        <div class="footer-sign">
            <span>──────────────── @ナヒーダ ────────────────</span>
        </div>
    </div>
</body>
</html>
