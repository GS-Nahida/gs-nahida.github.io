<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>围棋 AI</title>
    <style>
        :root {
            --bg-color: #2b2b2b;
            --panel-bg: #3c3f41;
            --text-color: #bbbbbb;
            --accent-color: #4b6eaf;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            user-select: none;
        }

        .container {
            display: flex;
            gap: 20px;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
        }

        .board-container {
            position: relative;
            background: #e1b16a;
            padding: 12px;
            border-radius: 6px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        canvas {
            display: block;
            cursor: pointer;
            border-radius: 2px;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .sidebar {
            width: 280px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .info-panel {
            background: #313335;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #4e5254;
        }

        .info-panel h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #fff;
            border-bottom: 1px solid #4e5254;
            padding-bottom: 5px;
        }

        .stat-item {
            margin: 8px 0;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }

        .stat-value {
            color: #629755;
            font-weight: bold;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #4e5254;
            color: #fff;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover:not(:disabled) { background: #5c6164; }
        .btn:active:not(:disabled) { transform: scale(0.98); }
        .btn.primary { background: var(--accent-color); }
        .btn.primary:hover:not(:disabled) { background: #3b5998; }
        .btn.success { background: #629755; }
        .btn.success:hover:not(:disabled) { background: #4b7a3f; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .status {
            margin-top: 15px;
            padding: 10px;
            background: #2b2b2b;
            border-left: 4px solid var(--accent-color);
            border-radius: 4px;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        /* 移动端布局适配：状态面板在上方，按钮在下方 */
        @media (max-width: 768px) {
            body {
                min-height: 100vh;
                padding: 10px;
            }

            .container {
                width: 100%;
                max-width: 100%;
                flex-direction: column;
                gap: 12px;
                padding: 12px;
            }

            .board-container {
                width: 100%;
                display: flex;
                justify-content: center;
                padding: 8px;
            }

            canvas {
                max-width: 100%;
                height: auto;
            }

            .sidebar {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .info-panel {
                order: 1;
            }

            .controls {
                order: 2;
            }

            .controls > div {
                flex-direction: row !important;
                flex-wrap: wrap;
                gap: 8px !important;
            }

            .btn {
                flex: 1;
                min-width: 45%;
                padding: 10px 6px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="board-container">
            <canvas id="goBoard"></canvas>
        </div>

        <div class="sidebar">
            <div class="info-panel">
                <h2>AI 引擎状态</h2>
                <div class="stat-item"><span>思考时间上限:</span><span class="stat-value" id="timeDisplay">5 秒</span></div>
                <div class="stat-item"><span>上一步模拟数:</span><span class="stat-value" id="itersDisplay">0</span></div>
                
                <div class="status" id="statusBox">准备就绪，请选择执黑或执白开始对局。</div>
            </div>

            <div class="controls">
                <div id="setupMenu" style="display: flex; flex-direction: column; gap: 10px;">
                    <button class="btn primary" onclick="startGame(1)">执黑 (先手)</button>
                    <button class="btn" onclick="startGame(2)">执白 (后手)</button>
                </div>
                <div id="playMenu" style="display: none; flex-direction: column; gap: 10px;">
                    <!-- 新增：确认落子按钮 -->
                    <button class="btn success" id="confirmBtn" onclick="confirmMove()" disabled>确认</button>
                    <button class="btn" id="passBtn" onclick="humanPass()">弃权 (Pass)</button>
                    <button class="btn" onclick="location.reload()">重新开始</button>
                </div>
            </div>
        </div>
    </div>

    <script id="workerScript" type="javascript/worker">
        const BOARD_SIZE = 19;
        const AREA = 361;
        const EMPTY = 0, BLACK = 1, WHITE = 2;
        const RAVE_EQUIVALENCE = 300;

        const neighbors = new Array(AREA);
        const diagonals = new Array(AREA);
        for (let i = 0; i < AREA; i++) {
            let r = Math.floor(i / BOARD_SIZE), c = i % BOARD_SIZE;
            let n = [], d = [];
            if (r > 0) n.push(i - BOARD_SIZE);
            if (r < 18) n.push(i + BOARD_SIZE);
            if (c > 0) n.push(i - 1);
            if (c < 18) n.push(i + 1);
            
            if (r > 0 && c > 0) d.push(i - BOARD_SIZE - 1);
            if (r > 0 && c < 18) d.push(i - BOARD_SIZE + 1);
            if (r < 18 && c > 0) d.push(i + BOARD_SIZE - 1);
            if (r < 18 && c < 18) d.push(i + BOARD_SIZE + 1);
            
            neighbors[i] = new Int16Array(n);
            diagonals[i] = new Int16Array(d);
        }

        function getGroupAndLiberties(board, start, color) {
            let stack = [start];
            let visited = new Uint8Array(AREA);
            visited[start] = 1;
            let group = [start];
            let liberties = new Set();

            while(stack.length > 0) {
                let curr = stack.pop();
                let nbs = neighbors[curr];
                for(let i=0; i<nbs.length; i++) {
                    let n = nbs[i];
                    if (board[n] === EMPTY) {
                        liberties.add(n);
                    } else if (board[n] === color && !visited[n]) {
                        visited[n] = 1;
                        stack.push(n);
                        group.push(n);
                    }
                }
            }
            return { group, libertiesCount: liberties.size, liberties };
        }

        function applyMove(board, move, color) {
            board[move] = color;
            let opp = 3 - color;
            let caps = 0;
            let nbs = neighbors[move];
            
            for(let i=0; i<nbs.length; i++) {
                let n = nbs[i];
                if(board[n] === opp) {
                    let res = getGroupAndLiberties(board, n, opp);
                    if(res.libertiesCount === 0) {
                        for(let j=0; j<res.group.length; j++) {
                            board[res.group[j]] = EMPTY;
                            caps++;
                        }
                    }
                }
            }
            return caps;
        }

        function isLegal(board, move, color) {
            if (board[move] !== EMPTY) return false;
            let sim = new Int8Array(board);
            applyMove(sim, move, color);
            return getGroupAndLiberties(sim, move, color).libertiesCount > 0;
        }

        function isEye(board, move, color) {
            let nbs = neighbors[move];
            for(let i=0; i<nbs.length; i++) {
                if (board[nbs[i]] !== color) return false;
            }
            let diags = diagonals[move];
            let diagCount = 0;
            for(let i=0; i<diags.length; i++) {
                if (board[diags[i]] === color) diagCount++;
            }
            return diags.length === 4 ? diagCount >= 3 : diagCount === diags.length;
        }

        function getHeuristicMove(board, lastMove, color) {
            if (lastMove === -1) return -1;
            let opp = 3 - color;
            let candidates = [];

            let nbs = neighbors[lastMove];
            for(let i=0; i<nbs.length; i++) {
                let n = nbs[i];
                if (board[n] === color) {
                    let res = getGroupAndLiberties(board, n, color);
                    if (res.libertiesCount === 1) { 
                        let lib = Array.from(res.liberties)[0];
                        if (isLegal(board, lib, color)) candidates.push(lib);
                    }
                } else if (board[n] === opp) {
                    let res = getGroupAndLiberties(board, n, opp);
                    if (res.libertiesCount === 1) { 
                        let lib = Array.from(res.liberties)[0];
                        if (isLegal(board, lib, color)) candidates.push(lib);
                    }
                }
            }

            if (candidates.length > 0) {
                return candidates[Math.floor(Math.random() * candidates.length)];
            }
            return -1;
        }

        class RAVEData {
            constructor() {
                this.visits = 0;
                this.wins = 0;
                this.raveVisits = 0;
                this.raveWins = 0;
            }
        }

        class Node {
            constructor(board, player, move = -1, parent = null) {
                this.board = board;
                this.player = player;
                this.move = move;
                this.parent = parent;
                this.children = [];
                this.stats = new RAVEData();
                this.childStats = new Map();
                this.untried = null;
            }

            expand() {
                if (this.untried === null) {
                    let legalMoves = [];
                    for(let i=0; i<AREA; i++) {
                        if (isLegal(this.board, i, this.player) && !isEye(this.board, i, this.player)) {
                            legalMoves.push(i);
                        }
                    }
                    
                    // 1. 打乱合法落子点，避免搜索偏好（如总是偏向棋盘右下角）
                    for (let i = legalMoves.length - 1; i > 0; i--) {
                        let j = Math.floor(Math.random() * (i + 1));
                        [legalMoves[i], legalMoves[j]] = [legalMoves[j], legalMoves[i]];
                    }
                    
                    this.untried = legalMoves;
                    for (let m of this.untried) {
                        this.childStats.set(m, new RAVEData());
                    }

                    // 2. 计算当前盘面棋子总数
                    let stonesCount = 0;
                    for(let i=0; i<AREA; i++) {
                        if(this.board[i] !== EMPTY) stonesCount++;
                    }
                    
                    // 3. 只有在棋盘上超过 280 颗子（进入深度收官）或无路可走时，才允许 Pass
                    if (stonesCount > 280 || this.untried.length === 0) {
                        // unshift 会把 -1 放在数组最前面，这样 pop() 时它就是最后一个被考虑的
                        this.untried.unshift(-1);
                        this.childStats.set(-1, new RAVEData());
                    }
                }
                
                if (this.untried.length === 0) return null;
                let move = this.untried.pop();
                let nextBoard = new Int8Array(this.board);
                if (move !== -1) applyMove(nextBoard, move, this.player);
                
                let child = new Node(nextBoard, 3 - this.player, move, this);
                this.children.push(child);
                return child;
            }

            getBestChild() {
                let best = null, maxVal = -Infinity;
                
                for (let child of this.children) {
                    let st = this.childStats.get(child.move);
                    if (!st || st.visits === 0) {
                        var uct = 10000 + Math.random(); 
                    } else {
                        let winRate = st.wins / st.visits;
                        let raveWinRate = st.raveVisits > 0 ? st.raveWins / st.raveVisits : 0;
                        let beta = st.raveVisits / (st.raveVisits + st.visits + st.visits * st.raveVisits / RAVE_EQUIVALENCE);
                        
                        let blendedWinRate = (1 - beta) * winRate + beta * raveWinRate;
                        var uct = blendedWinRate + 0.4 * Math.sqrt(Math.log(this.stats.visits) / st.visits);
                    }

                    if (uct > maxVal) { maxVal = uct; best = child; }
                }
                return best;
            }
        }

        function rollout(startBoard, startPlayer) {
            let sim = new Int8Array(startBoard);
            let player = startPlayer;
            let lastMove = -1;
            let passes = 0, depth = 0;

            let blackMoves = [];
            let whiteMoves = [];

            while(passes < 2 && depth < 80) {
                let move = -1;

                let hMove = getHeuristicMove(sim, lastMove, player);
                if (hMove !== -1 && !isEye(sim, hMove, player)) {
                    move = hMove;
                } else {
                    let startIdx = Math.floor(Math.random() * AREA);
                    for(let i=0; i<AREA; i++) {
                        let m = (startIdx + i) % AREA;
                        if (sim[m] === EMPTY && !isEye(sim, m, player) && isLegal(sim, m, player)) {
                            move = m;
                            break;
                        }
                    }
                }

                if (move === -1) {
                    passes++;
                } else {
                    passes = 0;
                    applyMove(sim, move, player);
                    if (player === BLACK) blackMoves.push(move);
                    else whiteMoves.push(move);
                }
                
                lastMove = move;
                player = 3 - player;
                depth++;
            }

            let b = 0, w = 0;
            for(let i=0; i<AREA; i++) {
                if(sim[i] === BLACK) b++;
                else if(sim[i] === WHITE) w++;
            }
            let winner = b > (w + 6.5) ? BLACK : WHITE; 

            return { winner, blackMoves, whiteMoves };
        }

        self.onmessage = function(e) {
            let { boardStr, player, timeLimit } = e.data;
            let rootBoard = new Int8Array(AREA);
            for(let i=0; i<AREA; i++) rootBoard[i] = parseInt(boardStr[i]);

            let root = new Node(rootBoard, player);
            let start = Date.now();
            let iters = 0;

            while (Date.now() - start < timeLimit) {
                let node = root;

                while (node.untried !== null && node.untried.length === 0 && node.children.length > 0) {
                    node = node.getBestChild();
                }

                let expanded = node.expand();
                if (expanded) node = expanded;

                let { winner, blackMoves, whiteMoves } = rollout(node.board, node.player);

                let curr = node;
                while (curr !== null) {
                    curr.stats.visits++;
                    if (winner === curr.player) curr.stats.wins++;

                    if (curr.parent) {
                        let amafMoves = (curr.parent.player === BLACK) ? blackMoves : whiteMoves;
                        for (let child of curr.parent.children) {
                            if (amafMoves.includes(child.move)) {
                                let st = curr.parent.childStats.get(child.move);
                                if (st) {
                                    st.raveVisits++;
                                    if (winner === curr.parent.player) st.raveWins++;
                                }
                            }
                        }
                    }

                    if (curr.parent) {
                        let pStat = curr.parent.childStats.get(curr.move);
                        if (pStat) {
                            pStat.visits++;
                            if (winner === curr.parent.player) pStat.wins++;
                        }
                    }

                    curr = curr.parent;
                }
                iters++;
            }

            let bestMove = -1;
            let maxVisits = -1;
            for (let child of root.children) {
                let st = root.childStats.get(child.move);
                if (st && st.visits > maxVisits) {
                    maxVisits = st.visits;
                    bestMove = child.move;
                }
            }

            postMessage({ move: bestMove, iters });
        };
    </script>

    <!-- 前端 UI 交互脚本 -->
    <script>
        const BOARD_SIZE = 19;
        const CELL_SIZE = 28;
        // 增加边距，为坐标数字和字母腾出空间
        const MARGIN = 40; 
        const BOARD_PX = CELL_SIZE * (BOARD_SIZE - 1);
        const CANVAS_SIZE = BOARD_PX + MARGIN * 2;
        const EMPTY = 0, BLACK = 1, WHITE = 2;

        // 围棋标准横向坐标跳过 'I'
        const COORD_LETTERS = "ABCDEFGHJKLMNOPQRST"; 

        const canvas = document.getElementById('goBoard');
        const ctx = canvas.getContext('2d');
        canvas.width = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;

        let board = new Int8Array(361);
        let humanColor = BLACK;
        let aiColor = WHITE;
        let currentPlayer = BLACK;
        let aiThinking = false;
        let lastMove = -1;
        
        // 新增：未确认的待落子位置
        let pendingMove = -1;

        const blob = new Blob([document.getElementById('workerScript').textContent], { type: 'application/javascript' });
        const worker = new Worker(URL.createObjectURL(blob));

        worker.onmessage = function(e) {
            let { move, iters } = e.data;
            document.getElementById('itersDisplay').innerText = iters;
            aiThinking = false;

            if (move === -1) {
                updateStatus('AI 选择 Pass（弃权），轮到您落子。');
            } else {
                applyGlobalMove(move, aiColor);
                
                // 将一维索引转为字母+数字的围棋坐标 (例如 D16)
                let r = Math.floor(move / BOARD_SIZE);
                let c = move % BOARD_SIZE;
                let coordStr = COORD_LETTERS[c] + (BOARD_SIZE - r);
                
                updateStatus(`AI 落子于 ${coordStr}。轮到您落子。`);
            }
            currentPlayer = humanColor;
            drawBoard();
        };

        function drawBoard() {
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // 绘制坐标系
            ctx.fillStyle = '#6e4726';
            ctx.font = 'bold 12px Consolas, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            for (let i = 0; i < BOARD_SIZE; i++) {
                let pos = MARGIN + i * CELL_SIZE;
                // 横向字母 (上下边缘)
                ctx.fillText(COORD_LETTERS[i], pos, MARGIN / 2 - 2);
                ctx.fillText(COORD_LETTERS[i], pos, CANVAS_SIZE - MARGIN / 2 + 2);
                
                // 纵向数字 (左右边缘，从上到下 19 到 1)
                let num = (BOARD_SIZE - i).toString();
                ctx.fillText(num, MARGIN / 2 - 4, pos);
                ctx.fillText(num, CANVAS_SIZE - MARGIN / 2 + 4, pos);
            }

            // 盘面线
            ctx.strokeStyle = '#3a2312';
            ctx.lineWidth = 1;
            for (let i = 0; i < BOARD_SIZE; i++) {
                const pos = MARGIN + i * CELL_SIZE;
                ctx.beginPath(); ctx.moveTo(MARGIN, pos); ctx.lineTo(MARGIN + BOARD_PX, pos); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(pos, MARGIN); ctx.lineTo(pos, MARGIN + BOARD_PX); ctx.stroke();
            }

            // 星位
            const stars = [ [3,3], [3,9], [3,15], [9,3], [9,9], [9,15], [15,3], [15,9], [15,15] ];
            ctx.fillStyle = '#3a2312';
            for (let [r, c] of stars) {
                ctx.beginPath();
                ctx.arc(MARGIN + c * CELL_SIZE, MARGIN + r * CELL_SIZE, 3.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // 棋子绘制
            for (let i = 0; i < 361; i++) {
                if (board[i] !== EMPTY) {
                    let r = Math.floor(i / BOARD_SIZE), c = i % BOARD_SIZE;
                    let x = MARGIN + c * CELL_SIZE, y = MARGIN + r * CELL_SIZE;

                    let grad = ctx.createRadialGradient(x-2, y-2, 2, x, y, CELL_SIZE*0.45);
                    if (board[i] === BLACK) {
                        grad.addColorStop(0, '#555'); grad.addColorStop(1, '#000');
                    } else {
                        grad.addColorStop(0, '#fff'); grad.addColorStop(1, '#ccc');
                    }

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(x, y, CELL_SIZE * 0.44, 0, Math.PI * 2);
                    ctx.fill();

                    if (i === lastMove) {
                        ctx.strokeStyle = board[i] === BLACK ? '#00e676' : '#d50000';
                        ctx.lineWidth = 2.5;
                        ctx.beginPath();
                        ctx.arc(x, y, CELL_SIZE * 0.2, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
            }

            if (pendingMove !== -1) {
                let r = Math.floor(pendingMove / BOARD_SIZE), c = pendingMove % BOARD_SIZE;
                let x = MARGIN + c * CELL_SIZE, y = MARGIN + r * CELL_SIZE;

                ctx.globalAlpha = 0.5; // 设置透明度
                let grad = ctx.createRadialGradient(x-2, y-2, 2, x, y, CELL_SIZE*0.45);
                if (humanColor === BLACK) {
                    grad.addColorStop(0, '#555'); grad.addColorStop(1, '#000');
                } else {
                    grad.addColorStop(0, '#fff'); grad.addColorStop(1, '#ccc');
                }

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, CELL_SIZE * 0.44, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0; // 恢复透明度
                
                // 为预览棋子添加边框提示
                ctx.strokeStyle = '#00e676';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x, y, CELL_SIZE * 0.44, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function applyGlobalMove(index, color) {
            board[index] = color;
            lastMove = index;
            
            let opp = 3 - color;
            let r = Math.floor(index / 19), c = index % 19;
            let nbs = [];
            if (r > 0) nbs.push(index - 19);
            if (r < 18) nbs.push(index + 19);
            if (c > 0) nbs.push(index - 1);
            if (c < 18) nbs.push(index + 1);

            for (let n of nbs) {
                if (board[n] === opp) {
                    let res = getGroupUI(n, opp);
                    if (!res.hasLib) {
                        for (let id of res.group) board[id] = EMPTY;
                    }
                }
            }
        }

        function getGroupUI(start, color) {
            let stack = [start], visited = new Uint8Array(361);
            visited[start] = 1;
            let group = [start], hasLib = false;

            while (stack.length > 0) {
                let curr = stack.pop();
                let r = Math.floor(curr / 19), c = curr % 19;
                let nbs = [];
                if (r > 0) nbs.push(curr - 19);
                if (r < 18) nbs.push(curr + 19);
                if (c > 0) nbs.push(curr - 1);
                if (c < 18) nbs.push(curr + 1);

                for (let n of nbs) {
                    if (board[n] === EMPTY) hasLib = true;
                    else if (board[n] === color && !visited[n]) {
                        visited[n] = 1; stack.push(n); group.push(n);
                    }
                }
            }
            return { group, hasLib };
        }

        function handleBoardClick(e) {
            if (aiThinking || currentPlayer !== humanColor) return;
            const rect = canvas.getBoundingClientRect();
            // 移动端 canvas 通过 CSS 缩放后，实际显示尺寸与内部绘制尺寸不同
            // 需要按缩放比例换算点击坐标，否则会产生严重偏移
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            const col = Math.round((x - MARGIN) / CELL_SIZE);
            const row = Math.round((y - MARGIN) / CELL_SIZE);

            if (col >= 0 && col < 19 && row >= 0 && row < 19) {
                let idx = row * 19 + col;
                if (board[idx] === EMPTY) {
                    // 修改：不直接落子，而是记录待确认位置
                    pendingMove = idx;
                    document.getElementById('confirmBtn').disabled = false;
                    drawBoard();
                }
            }
        }
        
        // 新增：确认落子函数
        function confirmMove() {
            if (pendingMove === -1 || aiThinking || currentPlayer !== humanColor) return;
            
            applyGlobalMove(pendingMove, humanColor);
            pendingMove = -1;
            document.getElementById('confirmBtn').disabled = true; // 恢复禁用
            drawBoard();
            triggerAI();
        }

        // 手机端使用 touchend，避免 touchstart 阻断浏览器 click
        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            handleBoardClick({ clientX: touch.clientX, clientY: touch.clientY });
        }, { passive: false });

        // 电脑端保持 click
        canvas.addEventListener('click', handleBoardClick);

        function triggerAI() {
            aiThinking = true;
            currentPlayer = aiColor;
            updateStatus('AI 正在全力演算中 (思考时长 5 秒)...');

            let boardStr = "";
            for (let i = 0; i < 361; i++) boardStr += board[i];

            worker.postMessage({
                boardStr: boardStr,
                player: aiColor,
                timeLimit: 5000 
            });
        }

        function startGame(color) {
            humanColor = color;
            aiColor = 3 - color;
            document.getElementById('setupMenu').style.display = 'none';
            document.getElementById('playMenu').style.display = 'flex';

            if (humanColor === WHITE) {
                triggerAI();
            } else {
                updateStatus('对局开始，请落子。');
            }
            drawBoard();
        }

        function humanPass() {
            if (aiThinking) return;
            // 如果玩家已经点出预览但没确认直接 pass，清除预览状态
            pendingMove = -1;
            document.getElementById('confirmBtn').disabled = true;
            drawBoard();
            
            updateStatus('您选择了弃权。');
            triggerAI();
        }

        function updateStatus(msg) {
            document.getElementById('statusBox').innerText = msg;
        }

        drawBoard();
    </script>
</body>
</html>
